<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle corner rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="240" r="140" fill="#ffffff" opacity="0.08" />

  <!-- Kalameh Institute & Book Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 250)">
    <!-- Open Book / Wings -->
    <path d="M -130,50 C -70,20 -20,35 0,65 C 20,35 70,20 130,50 C 130,-40 70,-70 0,-45 C -70,-70 -130,-40 -130,50 Z" 
          fill="url(#accent)" />
    
    <!-- Spine Divider Line -->
    <path d="M 0,-42 L 0,63" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />

    <!-- Academic Cap / Star of Knowledge above -->
    <path d="M 0,-115 L 75,-78 L 0,-42 L -75,-78 Z" fill="#ffffff" />
    <path d="M 50,-65 L 50,-10 C 45,5 30,12 15,12 C 0,12 -15,5 -20,-10 L -20,-65" 
          stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />
    <circle cx="68" cy="-5" r="5" fill="#fbbf24" />
    <path d="M 68,-5 L 68,15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>