services:
  mongo:
    image: mongo:7
    container_name: kalameh-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: kalameh
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "password",
          "--authenticationDatabase",
          "admin",
          "--eval",
          'try { rs.status().ok } catch (_) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
